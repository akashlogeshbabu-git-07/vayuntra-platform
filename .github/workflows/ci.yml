name: Vayuntra CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vayuntra_test
          POSTGRES_USER: vayuntra_app
          POSTGRES_PASSWORD: dev_password_change_in_prod
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      - name: Upgrade pip and install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
      
      - name: Install ruff linter
        run: pip install ruff pytest pytest-cov
      
      - name: Install backend dependencies
        run: |
          if [ -f backend/requirements.txt ]; then 
            pip install -r backend/requirements.txt
          fi
          if [ -f backend/requirements-dev.txt ]; then 
            pip install -r backend/requirements-dev.txt
          fi
      
      - name: Run Ruff Linter Check
        run: ruff check . --exit-zero || true
      
      - name: Run Ruff Format Check
        run: ruff format . --check --exit-zero || true
      
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U vayuntra_app -d vayuntra_test && break
            echo "Attempt $i: Waiting for PostgreSQL..."
            sleep 1
          done
      
      - name: Run Backend Tests
        run: |
          cd backend
          pytest tests/ -v --tb=short --cov=app --cov-report=xml || true
        env:
          DATABASE_URL: postgresql://vayuntra_app:dev_password_change_in_prod@localhost:5432/vayuntra_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          DEBUG: "false"
      
      - name: Upload Coverage Report
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          tags: vayuntra-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ml:
    name: Build ML Service Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build ML Image
        uses: docker/build-push-action@v4
        with:
          context: ./ml
          push: false
          tags: vayuntra-ml:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: false
          tags: vayuntra-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
